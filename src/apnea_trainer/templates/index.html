<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apnea Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-bold text-center mb-8">Apnea Trainer</h1>
            
            <!-- Warning Message -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-8">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-yellow-700">
                            WARNING: Breath-holding training can be dangerous and should only be performed under proper supervision.
                            This application is provided for educational purposes only.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Timer Display -->
            <div class="bg-white rounded-lg shadow-lg p-8 mb-8 text-center">
                <div id="timer" class="timer-display stopped">00:00</div>
                <div id="phase" class="text-xl mt-4">Ready</div>
                <div id="round" class="text-lg mt-2"></div>
            </div>

            <!-- Configuration Form -->
            <div id="config-form" class="bg-white rounded-lg shadow-lg p-8">
                <form id="timer-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Training Round Length (MM:SS)</label>
                        <input type="text" name="training_time" value="{{ config.training_time }}" pattern="\d+:\d{2}" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Training Round Change per Round (MM:SS)</label>
                        <input type="text" name="training_delta" value="{{ config.training_delta }}" pattern="-?\d+:\d{2}" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Rest Period Length (MM:SS)</label>
                        <input type="text" name="rest_time" value="{{ config.rest_time }}" pattern="\d+:\d{2}" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Rest Period Change per Round (MM:SS)</label>
                        <input type="text" name="rest_delta" value="{{ config.rest_delta }}" pattern="-?\d+:\d{2}" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Number of Rounds</label>
                        <input type="number" name="rounds" value="{{ config.rounds }}" min="1" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    
                    <div class="flex space-x-4">
                        <button type="submit" id="start-btn"
                                class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                            Start
                        </button>
                        <button type="button" id="stop-btn" disabled
                                class="flex-1 bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
                            Stop
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        const timerDisplay = document.getElementById('timer');
        const phaseDisplay = document.getElementById('phase');
        const roundDisplay = document.getElementById('round');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const configForm = document.getElementById('config-form');
        const timerForm = document.getElementById('timer-form');

        // Audio context for beeps
        let audioContext = null;

        function playBeep(count = 1, interval = 200) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.2);  // Back to 200ms
                }, i * interval);
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onopen = function() {
                console.log('WebSocket connection established');
                // Reset UI state on new connection
                startBtn.disabled = false;
                stopBtn.disabled = true;
                timerDisplay.className = 'timer-display stopped';
                phaseDisplay.textContent = 'Ready';
                roundDisplay.textContent = '';
            };
            
            ws.onmessage = function(event) {
                console.log('Received message:', event.data);
                const data = JSON.parse(event.data);
                
                switch(data.type) {
                    case 'tick':
                        timerDisplay.textContent = data.time;
                        timerDisplay.className = `timer-display ${data.phase}`;
                        break;
                        
                    case 'round_start':
                        roundDisplay.textContent = `Round ${data.round} of ${data.total_rounds}`;
                        phaseDisplay.textContent = 'Training';
                        break;
                        
                    case 'phase_change':
                        phaseDisplay.textContent = data.phase === 'rest' ? 'Rest' : 'Training';
                        // Play two beeps when training ends, single beep when rest ends
                        playBeep(data.phase === 'rest' ? 2 : 1);
                        break;
                        
                    case 'session_complete':
                        phaseDisplay.textContent = 'Complete';
                        timerDisplay.className = 'timer-display stopped';
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        playBeep(2);  // Two beeps at completion
                        break;
                        
                    case 'status':
                        console.log(data.message);
                        break;
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = function() {
                console.log('WebSocket connection closed');
                // Reset UI state
                startBtn.disabled = false;
                stopBtn.disabled = true;
                timerDisplay.className = 'timer-display stopped';
                phaseDisplay.textContent = 'Stopped';
                roundDisplay.textContent = '';
                // Reconnect after a short delay
                setTimeout(connectWebSocket, 100);
            };
        }

        timerForm.onsubmit = function(e) {
            e.preventDefault();
            const formData = new FormData(timerForm);
            const config = {
                action: 'start',
                config: {
                    training_time: formData.get('training_time'),
                    training_delta: formData.get('training_delta'),
                    rest_time: formData.get('rest_time'),
                    rest_delta: formData.get('rest_delta'),
                    rounds: formData.get('rounds')
                }
            };
            
            console.log('Sending config:', config);  // Add logging
            ws.send(JSON.stringify(config));
            startBtn.disabled = true;
            stopBtn.disabled = false;
        };

        stopBtn.onclick = function() {
            console.log('Sending stop command');  // Add logging
            // Update UI immediately
            startBtn.disabled = false;
            stopBtn.disabled = true;
            timerDisplay.className = 'timer-display stopped';
            phaseDisplay.textContent = 'Stopped';
            roundDisplay.textContent = '';
            // Send stop command
            ws.send(JSON.stringify({ action: 'stop' }));
            // The WebSocket will be closed by the server
            // The onclose handler will handle reconnection
        };

        // Connect WebSocket when page loads
        connectWebSocket();
    </script>
</body>
</html>
