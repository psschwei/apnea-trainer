[project]
name = "apnea_trainer"
version = "0.1.0"
description = "A command-line timer for apnea training sessions"
authors = [
    {name = "Paul S. Schweigert", email = "paul@paulschweigert.com"}
]
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "tomli>=2.0.1",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "websockets>=12.0"
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "Apache-2.0"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
apnea-trainer = "apnea_trainer.timer:main"
apnea-trainer-gui = "apnea_trainer.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apnea_trainer"]

[tool.hatch.metadata]
allow-direct-references = true 